# The gateway: spreads requests over two shop replicas and routes around one that is dead or frozen.
# The replicas have fixed addresses (docker-compose.yml), so nginx never has to re-resolve names after a restart.
upstream shops {
    server 172.29.0.11:8000 max_fails=1 fail_timeout=3s;     # shop1
    server 172.29.0.12:8000 max_fails=1 fail_timeout=3s;     # shop2
}

server {
    listen 80;

    location = /healthz { default_type text/plain; return 200 "ok\n"; }

    location / {
        proxy_pass http://shops;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 1s;                 # a dead replica refuses at once, a missing one times out after 1 s
        proxy_read_timeout 2500ms;                 # a frozen replica is given up on after 2.5 s
        proxy_next_upstream error timeout;        # then the request is retried on the other replica
        proxy_next_upstream_tries 2;
    }
}
